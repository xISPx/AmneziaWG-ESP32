sentence=AmneziaWG (obfuscated WireGuard 3.x) VPN client for ESP32.
paragraph=Junk packets, Sx-prefixes and ChaCha20 header protection on top of a WireGuard-lwIP core. Creates a lwIP network interface and routes all device traffic through the tunnel. Supports preshared keys, ContentPaddingAddition and monotonic handshake timestamps that survive reboots and NTP time jumps.
